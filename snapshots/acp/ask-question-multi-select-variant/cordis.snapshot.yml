# Keyless counterpart to ask-question-multi-select-variant.cordis.yml: keep the
# real interaction seam, model-facing tool, and auto-answer provider while
# replacing DeepSeek with per-session replay.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: user-questions
      name: '@deepseek-ai/dsh-user-questions'
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
    - id: ask-auto-answer
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/ask-auto-answer.ts'
