# Keyless replay counterpart of dsh-memory.cordis.yml: the same memory plugin
# insert plus the recorded-response adapter swap over the shipped acp profile.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: dsh-memory
      name: '@deepseek-ai/dsh-memory'
      config:
        claudeHome: !!js process.cwd() + '/.claude'
        maxIndexBytes: 25600
        global:
          maxIndexBytes: 8192
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
