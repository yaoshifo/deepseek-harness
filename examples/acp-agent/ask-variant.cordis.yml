# Snapshot-only human-interaction composition. The provider answers every
# question deterministically, so the key-style-variant replay exercises the
# normalization boundary end to end: the model emits `multiSelect`, the card
# still asks, and the answer settles the turn.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: user-questions
            name: '@deepseek-ai/dsh-user-questions'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: ask-auto-answer
            name: './tests/fixtures/ask-auto-answer.ts'
