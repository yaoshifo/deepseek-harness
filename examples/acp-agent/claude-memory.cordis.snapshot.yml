# Keyless replay counterpart of claude-memory.cordis.yml: the same memory
# plugin insert plus the recorded-response adapter swap, applied directly to
# the live tree because patches do not compose across includes.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: claude-memory
            name: '@deepseek-ai/dsh-tool-claude-memory'
            config:
              claudeHome: !!js process.cwd() + '/.claude'
              maxIndexBytes: 25600
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
