# feishu-bridge profile patch layer (hot-reloaded by Cordis HMR — editing
# this file while the runtime is up applies transactionally, no restart).
#
# This profile hosts the dsh-feishu-bridge daemon: the plugin that replaces
# the retired cc-connect Go binary (see packages/acp/feishu-bridge/docs/
# MIGRATION.md). Rows mirror the production cc-connect profile where the
# behavior is agent-runtime-generic; feishu bot/engine config lives in the
# feishu-bridge plugin row instead of this file.

- id: agent-instructions
  config:
    # Replaces the dsh-base row wholesale (patch config is key-replacement,
    # not a deep merge), so maxBytes must be repeated.
    maxBytes: 65536
    instructionFileCandidates:
      - CLAUDE.md
    localInstructionFileCandidates:
      - CLAUDE.local.md

- id: skill-filesystem
  config:
    customSkillDirs:
      # absolute path required: entries go through path.resolve, which does
      # NOT expand "~"
      - /home/hm/.claude/skills

- id: sandbox-policy
  config:
    mode: danger-full-access

# permission-presets need an explicit defaultPreset: with sandbox
# mode=danger-full-access, composed defaults match no preset → dsh boot
# crashes exit 1 without this.
- id: permission
  config:
    defaultPreset: danger-full-access

# plan:policy references ask_user_question, which dsh-base never mounts
# (only CLI presets do) — mount it here; questions ride the bridge's
# user-questions provider to the Feishu card.
- insert:
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

# Built-in web_search resolves DEEPSEEK_API_KEY which this deployment never
# configures — web-search-prime MCP is the working search path.
- id: tool-web
  disabled: true

# str_replace_editor duplicates read/edit/write; all user-side guidance
# references the latter.
- id: tool-str-replace-editor
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    persona: ''

- insert:
    # Claude Code memory sharing: same ~/.claude/projects/<slug>/memory/
    # directory as Claude Code.
    - id: claude-memory
      name: '@deepseek-ai/dsh-tool-claude-memory'
      config:
        maxIndexBytes: 25600

- id: llm-pi-ai
  config:
    providers:
      # One named route per cc-connect [[providers]] entry (MIGRATION.md D2):
      # the in-process engine selects a route per agent via
      # agentOptions.provider; credentials are inline, traffic goes DIRECT to
      # Keys resolve by env-var reference (credential-ref): provision
      # FB_GLM_API_KEY / FB_MINIMAX_API_KEY / FB_MIMO_API_KEY in the daemon
      # environment (systemd unit Environment= lines).
      # the gateway (the Go providerproxy is retired — plain model names
      # avoid the bigmodel [1m] fingerprint gate; forceAdaptiveThinking
      # covers the thinking/effort quirk; retries ride dsh llm-retry).
      glm:
        displayName: GLM
        apiKeyEnv: FB_GLM_API_KEY
        api: anthropic-messages
        baseURL: https://open.bigmodel.cn/api/anthropic
        reasoning: high
        compat:
          forceAdaptiveThinking: true
        models:
          - id: glm-5.3
            name: GLM 5.3
            contextWindow: 1000000
            reasoningEfforts:
              "off": null
              low: low
              medium: medium
              high: high
      turbo:
        displayName: GLM Turbo
        apiKeyEnv: FB_GLM_API_KEY
        api: anthropic-messages
        baseURL: https://open.bigmodel.cn/api/anthropic
        reasoning: high
        compat:
          forceAdaptiveThinking: true
        models:
          - id: glm-5-turbo
            name: GLM 5 Turbo
            contextWindow: 1000000
            reasoningEfforts:
              "off": null
              low: low
              medium: medium
              high: high
      minimax:
        displayName: MiniMax
        apiKeyEnv: FB_MINIMAX_API_KEY
        api: anthropic-messages
        baseURL: https://api.minimaxi.com/anthropic
        reasoning: high
        compat:
          forceAdaptiveThinking: true
        models:
          - id: MiniMax-M2.7
            name: MiniMax M2.7
            contextWindow: 1000000
            reasoningEfforts:
              "off": null
              low: low
              medium: medium
              high: high
      mimo:
        displayName: MiMo
        apiKeyEnv: FB_MIMO_API_KEY
        api: anthropic-messages
        baseURL: https://token-plan-cn.xiaomimimo.com/anthropic
        reasoning: high
        compat:
          forceAdaptiveThinking: true
        models:
          - id: mimo-v2.5-pro
            name: MiMo v2.5 Pro
            contextWindow: 1000000
            reasoningEfforts:
              "off": null
              low: low
              medium: medium
              high: high

- id: session-persistence-jsonl
  config:
    # Same store the retired Go backend used (per-cwd nesting is done by the
    # jsonl backend itself via meta.cwd) — existing sessions resume as-is.
    root: /home/hm/.dsh/cc-connect-sessions
    compression: zstd

# The feishu-bridge daemon plugin. projects are managed by the plugin config
# (bots, workdirs, per-project features); starts empty until M1 cut-over.
# Config surface mirrors src/index.ts Config (Go wire.go's config face):
- id: feishu-bridge
  config:
    projects: []
    # dataDir: ~/.dsh/feishu-bridge        # per-project session/state root
    # language: zh                         # zh | zh-TW | ja | es | en; else auto-detect
    # idleTimeoutMins: 120                 # stall kill window; 0 disables
    # attachmentSend: true                 # side-channel image/file delivery
    # queue: { maxDepth: 5 }               # per-session queued-message cap
    # subtask:                             # recursive delegation caps
    #   maxDepth: 3
    #   timeoutSec: 0                      # 0 inherits idleTimeoutMins
    #   gatherTimeoutSec: 1200
    # spawn:                               # /spawn //fork defaults
    #   worktree: auto                     # auto | on | off
    #   memoryWarnPct: 80                  # 0 disables the warning tier
    #   memoryBlockPct: 90                 # 0 disables the block tier
    # cron:                                # scheduled-task defaults (/cron)
    #   silent: false                      # suppress the ⏰ start notice
    #   sessionMode: reuse                 # reuse | new_per_run
    # relay:                               # bot-to-bot relay (/bind)
    #   timeoutSecs: 120                   # wait per relay response; 0 disables
    # chatroom:                            # multi-role chatroom tuning ([chatroom])
    #   rolesDir: ~/.claude/chatroom-roles # one persona subdirectory per role
    #   maxRoles: 5                        # role agents per chatroom cap
    #   moderatorDir: ~/chatroom           # ledger home; empty disables ledgers
    #   gatherTimeoutSec: 1200             # gather barrier fallback timeout
    #   endTimeoutSec: 600                 # end barrier drain timeout
    #   researchTimeoutSec: 3600           # research round timeout (clamped 60..86400)
    #   maxResearchRounds: 3               # auto-mode research cap (clamped 1..20)
    #   defaultResearchMode: auto          # auto | manual
    #   researchWorkspace: ~/chatroom/research  # shared assistant workdir
    #   researchPythonEnv: true            # pre-provision the shared uv venv
    # Per-project monitor block (#53): observe + triage + auto-spawn subgroups.
    #   monitor:
    #     enabled: true
    #     chats: "oc_xxx"                  # comma-separated chat IDs; * = all groups
    #     mode: monitor                    # monitor (alert triage) | dispatch (hub)
    #     spawnNotice: true                # heads-up card on spawn
    #     maxConcurrent: 5                 # active-subgroup cap per monitored chat
    #     triageProvider: mify-dsh         # LLM triage route; empty = active
    #     pollIntervalSec: 30              # poll for event-less webhook cards; 0 = off
    #     fallbackUser: ou_xxx             # owner for sender-less webhook cards
    #     coalesceEnabled: true            # same-dir alerts join the active subgroup
    #     coalesceWindowSec: 300           # 0 = no age limit
    #     contextWindow: 0                 # messages of LLM triage context; 0 = single
    #     learnEnabled: true               # /learn few-shot teaching
    #     learnMaxExamples: 20
    #     reactEmoji: Get                  # OnIt reaction; none disables
    #     dirs:                            # directory menu the LLM routes to
    #       - path: /Users/hm/workspace/riskai
    #         description: riskai 风控服务
    #     rules:                           # deterministic fast-path
    #       - pattern: "panic|500|报错"
    #         dir: /Users/hm/workspace/riskai
    #         task: "排查：{{message}}"    # {{message}} = the message text
    #         noReport: false              # fire-and-forget child
    # streamPreview:                       # streaming preview tuning
    #   enabled: true
    #   intervalMs: 800
    # display:                             # shared display defaults
    #   thinkingMessages: true
    #   thinkingMaxLen: 300
    #   toolMaxLen: 400
    #   planMaxLen: 4000
    #   toolMessages: true
    #   toolProgress: true
    #   progressSpinner: true              # running-state header GIF
    #   patchRateIntervalMs: 120           # global card PATCH rate limit
    #   stallTimeoutSecs: 200
    #   stallMaxRetries: 3
    # Per-project extras (inside a projects[] row):
    #   adminFrom: "ou_xxx,ou_yyy"         # privileged-command allowlist; * = all
    #   interactiveIdleTimeoutMins: 30     # idle reaper threshold
    #   resetOnIdleMins: 720               # rotate chat to a fresh session after N idle minutes
    #   filterExternalSessions: true       # /list only shows engine-tracked sessions
    #   providerShortcuts:                 # quick switch + new session (/strong → glm)
    #     strong: glm
    #     weak: mimo
    #   predictNext:                       # next-message prediction card (#33)
    #     enabled: true
    #     provider: turbo                  # named route for the prediction fork
    #     timeoutSec: 120
    #     mode: lightweight                # lightweight | resume (fork live transcript)
    #   turnSummary:                       # one-line turn summary on the insight card
    #     enabled: true
    #     provider: turbo
    #     timeoutSec: 30
    #   autoCompress:                      # compress context past a token threshold
    #     enabled: true
    #     maxTokens: 80000
    #     minGapMins: 30
