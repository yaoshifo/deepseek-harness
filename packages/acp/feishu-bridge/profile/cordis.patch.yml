    #   stallMaxRetries: 3
    # Per-project plan/reply HTML render block (#47/#48, Go [projects.plan_render]):
    #   planRender:
    #     enabled: true                    # opt-in; default off
    #     provider: mify-dsh               # render-session route; empty = active
    #     effort: low                      # low/medium/high/max/off; always-thinking models need low+
    #     timeoutSec: 600                  # fork timeout; speculative pre-render caps at 360
