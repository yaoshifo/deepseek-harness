# The feishu-bridge bundle patch: mounts the bridge plugin row on top of
# whatever the profile's earlier bundles (dsh-base) already installed.
- insert:
    - id: feishu-bridge
      name: '@deepseek-ai/dsh-feishu-bridge'

# The daemon's config-apply gate is /reload (the restart re-reads everything
# from disk). Config watching would be unsafe here twice over: it only ever saw
# the profile directory, and the reload.sh dump-config preflight rewrites the
# profile's cordis.yml root — a live watcher would treat that rewrite as a
# config change and hot-reload the old daemon mid-reload. Suppressing this row
# is the whole freeze: dsh-base owns configuration watching through this row,
# so removing `disabled: true` restores transactional config HMR.
- id: hmr
  disabled: true

# The engine drives parent turns itself, so the subagent runtime's own wake
# would spend a model request it never scheduled — deliver settlements
# externally. dsh-base already mounts the runtime and the spawn/fork
# providers; the bridge must not mount them again (DUPLICATE_PROVIDER), it
# only overrides the delivery mode here.
- id: subagent
  config:
    settlementNotice: external

# Bridge-spawned children report through feishu_bridge_subtask action=report
# (the child persona states it is the only way back). The runtime's own
# `report` tool delivers into the runtime parent inbox — a channel the engine
# cannot observe — so a child using it double-delivers (runtime splice plus
# engine settlement card and wake, 2026-08-27 oc_56801302). A toolFilter deny
# cannot name it: the tool registers per child, not globally, so composition
# is the enforcement point. The subagents service's reportFrom path stays
# available for native-parent delivery (reportChildToNativeParent).
- id: tool-subagent-report
  disabled: true

# Single delegation entry point: the generic `subagent` / `subagent_fork`
# tools stay disabled (the live profile has carried this disable since
# 2026-08-25; this backfills it into the bundle so a repo composition cannot
# expose them). Their children are invisible to the engine — not in
# native_children, so no settlement, no gather, no restart recovery — and with
# the report tool disabled above their results would be silently lost. The
# control tools (send_message / interrupt_agent / list_agents) stay mounted:
# they serve the runtime-wide agent surface the bridge itself relies on.
- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

# The question machinery: the ask_user_question tool (bridge ask cards,
# user-questions settlement) has no dsh-base row — every bridge composition
# needs it, so the bundle patch mounts it.
- insert:
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

# Declarative delivery (upstream present tool): the model names finished
# files as the user's deliverables and the engine auto-delivers them into
# the chat (deliverables/presented → sendToSessionWithAttachments).
# feishu_bridge_send stays as the direct on-demand channel.
- insert:
    - id: tool-present
      name: '@deepseek-ai/dsh-tool-present'

# The session memory surface (memory_* tools, per-session plus global
# indexes) is part of the bridge product experience; index limits tuned for
# card-length context. Mounted here so every bridge composition carries it.
- insert:
    - id: dsh-memory
      name: '@deepseek-ai/dsh-memory'
      config:
        maxIndexBytes: 25600
        global:
          maxIndexBytes: 8192

# Deployment tool roster (2026-08-20 cc-connect lineage, carried identically
# by both live profiles): the goal family (domain + round driver + /goal
# command + tool — disabling only the tool row would leave /goal-created
# goals with no tool to close, burning rounds), workflow, and ralph stay
# off: low-frequency orchestration whose schemas cost request context every
# turn. A fresh bridge deployment gets the same lean roster.
- id: goal
  disabled: true

- id: goal-round-driver
  disabled: true

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: tool-workflow
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-ralph
  disabled: true

# Single editor surface: the session editor is dsh-tool-fs's edit. Upstream
# removed tool-str-replace-editor from the default tools (PR #3611), so the
# bridge patch no longer needs a disable entry for it.

# Bridge sessions carry their own identity and persona injection (deployment
# persona sections, CC_FEISHU_* routing); base's harness identity line would
# duplicate it. Config is key-replacement, so persona repeats base's value.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    persona: ''

# Instruction-file convention: bridge sessions read CLAUDE.md and
# CLAUDE.local.md (the Claude Code-compatible convention). Config is
# key-replacement, so maxBytes repeats dsh-base's value.
- id: agent-instructions
  config:
    maxBytes: 65536
    instructionFileCandidates:
      - CLAUDE.md
    localInstructionFileCandidates:
      - CLAUDE.local.md

# Host-plane suppression registry for workspace instructions: bare-persona and
# render-fork sessions suppress instruction injection through it in agent
# setup. The plugin itself is serviceless (preset-mountable), so the registry
# mounts here on the host plane.
- insert:
    - id: agent-instruction-suppression
      name: '@deepseek-ai/dsh-agent-instructions/suppression'

# The plan-mode section: base stays upstream-verbatim (the fork's guidance
# prose lives only here), and this composition's delta is four fork guidance
# transformations — parallel exploration by default (dispatched through
# feishu_bridge_subtask), parallel/serial group marking in the
# decision-complete paragraph, the rejection discussion round (backed by the
# rejection hold: after a rejected review, exit_plan_mode bounces until the
# user speaks again — their next message or their answer to a question card),
# and the two-layer exit call (plain language in the
# plan argument, implementation details in the details argument). When the
# upstream section evolves, re-adapt the text here (the lockstep spec in
# tests/bundle-patch.spec.ts fails until the delta is exactly those four
# documented transformations). This replaces the per-profile cordis.patch.yml
# overrides that drifted per machine (2026-08-21 shims, retired 2026-09-01);
# the graft on dsh-base's own section and the three presets was reverted
# 2026-09-06.
- id: plan-mode
  config:
    section: |
          You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

          Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery. Exploration parallelizes by default: a repo-wide scan, cross-cutting audit, broad merge or release review, or a request naming several directions is several investigations — split it into 2–5 independent angles up front and dispatch them together as feishu_bridge_subtask spawns in one assistant message, each with a focused, self-contained brief that tells the child to read and report only, and fold their results into the plan. Keep exploration serial only for a single-focus question one or two reads can answer — judge focus by how many subsystems or directions the answer must cover, not by how few commands could skim it.

          The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

          Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

          Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem and state the execution order — independent groups dispatched together as parallel subtask spawns when execution begins, serially dependent groups executed in order; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement the plan together with its details layer without making design decisions.

          When ready, call exit_plan_mode with the plan's two layers as its two arguments: the plain-language layer in the plan argument (starting with a # title) and the implementation-details layer in the details argument. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, the feedback opens a discussion round: respond to it in your reply text and end your turn — answer questions, address critique, and note any change the feedback implies without resubmitting; exit_plan_mode is held for the rest of the turn after a rejection. Present the revised plan only when the user asks for it; when the feedback is empty, ask what to change instead of guessing. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
    # 2026-09-14: after a rejected review, exit_plan_mode bounces for the rest
    # of the turn (the corrective error carries the directive); the user
    # speaking again — a new turn, a mid-turn steer, or their answer to a
    # question card — lifts the hold. Default off keeps the classic
    # revise-and-present-again rhythm for other deployments.
    rejectionHold: true
